<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Electron Mirror - Overview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            user-select: none;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 0 16px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .device-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .device-serial {
            font-size: 11px;
            color: #555;
            font-family: 'SF Mono', Monaco, monospace;
        }

        .nav-section {
            padding: 12px 10px;
        }

        .nav-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #444;
            padding: 0 8px;
            margin-bottom: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.55);
            transition: all 0.15s;
            font-size: 13px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.9);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            color: #667eea;
        }

        .nav-item svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Quick Paths Submenu - 只在檔案管理時展開 */
        .quick-paths-submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, opacity 0.2s ease, visibility 0.25s;
            opacity: 0;
            visibility: hidden;
            margin-left: 28px;
            border-left: 2px solid rgba(102, 126, 234, 0.2);
            padding-left: 8px;
        }

        .quick-paths-submenu.expanded {
            max-height: 300px;
            opacity: 1;
            visibility: visible;
        }

        .quick-path {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.55);
            transition: all 0.15s;
            font-size: 13px;
        }

        .quick-path:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.9);
        }

        .quick-path.active {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
        }

        .quick-path svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 20px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .page-header .toolbar {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 7px 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #aaa;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(102, 126, 234, 0.4);
        }

        .btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
        }

        /* Search Box */
        .search-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            padding: 5px 10px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 11px;
            outline: none;
            width: 120px;
        }

        .search-box svg {
            width: 12px;
            height: 12px;
            fill: #555;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 2px;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px;
            border-radius: 6px;
        }

        .filter-tab {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            color: #666;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-tab:hover {
            color: #ccc;
        }

        .filter-tab.active {
            background: rgba(102, 126, 234, 0.3);
            color: #fff;
        }

        /* View Mode Toggle */
        .view-toggle {
            display: flex;
            gap: 2px;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px;
            border-radius: 6px;
        }

        .view-btn {
            width: 28px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .view-btn svg {
            width: 14px;
            height: 14px;
            fill: #555;
        }

        .view-btn:hover svg {
            fill: #aaa;
        }

        .view-btn.active {
            background: rgba(102, 126, 234, 0.3);
        }

        .view-btn.active svg {
            fill: #fff;
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .breadcrumb span {
            color: #667eea;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 3px;
        }

        .breadcrumb span:hover {
            background: rgba(102, 126, 234, 0.15);
        }

        .breadcrumb .sep {
            color: #444;
            cursor: default;
        }

        .breadcrumb .sep:hover {
            background: none;
        }

        /* Info Cards Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 12px 14px;
        }

        .info-card .label {
            font-size: 10px;
            color: #555;
            margin-bottom: 3px;
        }

        .info-card .value {
            font-size: 13px;
            color: #fff;
            font-weight: 500;
        }

        .info-card .sub-value {
            font-size: 10px;
            color: #444;
            margin-top: 1px;
        }

        /* Feature Cards */
        .feature-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .feature-card:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: rgba(102, 126, 234, 0.25);
        }

        .feature-card svg {
            width: 18px;
            height: 18px;
            fill: #667eea;
        }

        .feature-card .title {
            font-size: 13px;
            color: #fff;
        }

        /* File List */
        .file-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .file-item svg {
            width: 16px;
            height: 16px;
            fill: #667eea;
            flex-shrink: 0;
        }

        .file-item .name {
            flex: 1;
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item .size {
            color: #444;
            font-size: 10px;
            margin-right: 6px;
        }

        .file-item .actions {
            display: flex;
            gap: 3px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .file-item:hover .actions {
            opacity: 1;
        }

        .file-item .actions button {
            width: 24px;
            height: 24px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-item .actions button:hover {
            background: rgba(102, 126, 234, 0.25);
        }

        .file-item .actions button svg {
            width: 11px;
            height: 11px;
            fill: #aaa;
        }

        /* App Grid - Grid View */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        .app-grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .app-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.15s;
        }

        .app-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(102, 126, 234, 0.25);
        }

        .app-item .app-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-item .icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .app-item .icon.gradient-1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .app-item .icon.gradient-2 {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .app-item .icon.gradient-3 {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .app-item .icon.gradient-4 {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }

        .app-item .icon.gradient-5 {
            background: linear-gradient(135deg, #fa709a, #fee140);
        }

        .app-item .icon.gradient-6 {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
        }

        .app-item .icon img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }

        .app-item .icon svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .app-item .info {
            flex: 1;
            min-width: 0;
        }

        .app-item .name {
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-item .package {
            color: #444;
            font-size: 9px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-item .app-actions {
            display: flex;
            gap: 3px;
            margin-top: 4px;
        }

        .app-item .app-actions button {
            flex: 1;
            padding: 5px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            cursor: pointer;
            font-size: 9px;
            color: #666;
            transition: all 0.15s;
        }

        .app-item .app-actions button:hover {
            background: rgba(102, 126, 234, 0.25);
            color: #fff;
        }

        .app-item .app-actions button.danger:hover {
            background: rgba(231, 76, 60, 0.25);
            color: #e74c3c;
        }

        /* List View for Apps */
        .app-grid.list-view .app-item {
            flex-direction: row;
            align-items: center;
            padding: 8px 12px;
        }

        .app-grid.list-view .app-item .app-header {
            flex: 1;
        }

        .app-grid.list-view .app-item .app-actions {
            margin-top: 0;
            flex: none;
        }

        .app-grid.list-view .app-item .app-actions button {
            padding: 5px 8px;
        }

        /* Loading & Empty States */
        .loading,
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 180px;
            color: #444;
            font-size: 12px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Battery indicator */
        .battery-bar {
            width: 40px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-right: 5px;
        }

        .battery-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            border-radius: 3px;
        }

        .battery-fill.low {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }

        .battery-fill.charging {
            background: linear-gradient(90deg, #f1c40f, #f39c12);
        }

        /* Page sections */
        .page-section {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .page-section.active {
            display: flex;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 18px;
            min-width: 280px;
        }

        .modal h3 {
            color: #fff;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .modal input {
            width: 100%;
            padding: 9px 11px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: #fff;
            font-size: 12px;
            margin-bottom: 14px;
        }

        .modal .modal-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(30, 30, 50, 0.95);
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 12px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="device-name" id="deviceName">載入中...</div>
            <div class="device-serial" id="deviceSerial">--</div>
        </div>

        <nav class="nav-section">
            <div class="nav-label">功能</div>
            <div class="nav-item active" data-page="overview" onclick="switchPage('overview')">
                <svg viewBox="0 0 24 24">
                    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
                </svg>
                <span>總覽</span>
            </div>
            <div class="nav-item" onclick="startScreenMirror()">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z" />
                </svg>
                <span>螢幕鏡像</span>
            </div>

            <!-- 檔案管理 + 快速存取子選單 -->
            <div class="nav-item" data-page="files" onclick="switchPage('files')">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" />
                </svg>
                <span>檔案管理</span>
            </div>
            <!-- Quick Paths 子選單 - 只在檔案管理時展開 -->
            <div id="quickPaths" class="quick-paths-submenu">
                <div class="quick-path" data-path="/" onclick="navigateTo('/')">🏠 根目錄</div>
                <div class="quick-path" data-path="/sdcard" onclick="navigateTo('/sdcard')">📁 內部儲存</div>
                <div class="quick-path" data-path="/sdcard/Download" onclick="navigateTo('/sdcard/Download')">📥 下載
                </div>
                <div class="quick-path" data-path="/sdcard/DCIM" onclick="navigateTo('/sdcard/DCIM')">📷 相機</div>
                <div class="quick-path" data-path="/sdcard/Pictures" onclick="navigateTo('/sdcard/Pictures')">🖼️ 圖片
                </div>
                <div class="quick-path" data-path="/sdcard/Music" onclick="navigateTo('/sdcard/Music')">🎵 音樂</div>
                <div class="quick-path" data-path="/sdcard/Documents" onclick="navigateTo('/sdcard/Documents')">📄 文件
                </div>
            </div>

            <div class="nav-item" data-page="apps" onclick="switchPage('apps')">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z" />
                </svg>
                <span>應用管理</span>
            </div>
            <div class="nav-item" data-page="notifications" onclick="switchPage('notifications')">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
                </svg>
                <span>通知中心</span>
            </div>
        </nav>
    </aside>

    <main>
        <!-- Overview Page -->
        <div id="page-overview" class="page-section active">
            <div class="page-header">
                <h1>📱 總覽</h1>
            </div>
            <div id="overview-content">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- File Browser Page -->
        <div id="page-files" class="page-section">
            <div class="page-header">
                <h1>📁 檔案管理</h1>
                <div class="toolbar">
                    <button class="btn" onclick="copyPath()" title="複製路徑">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                        </svg>
                        複製路徑
                    </button>
                    <button class="btn" onclick="showGotoModal()" title="跳轉">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z" />
                        </svg>
                        跳轉
                    </button>
                    <button class="btn" onclick="navigateTo('/sdcard')" title="首頁">
                        <svg viewBox="0 0 24 24">
                            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                        </svg>
                        首頁
                    </button>
                    <button class="btn btn-primary" onclick="uploadFile()">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z" />
                        </svg>
                        上傳
                    </button>
                </div>
            </div>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div id="file-content" class="file-list">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- App Manager Page -->
        <div id="page-apps" class="page-section">
            <div class="page-header">
                <h1>📦 應用管理</h1>
                <div class="toolbar">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                        </svg>
                        <input type="text" id="appSearch" placeholder="搜索..." oninput="filterApps()">
                    </div>
                    <div class="filter-tabs">
                        <div class="filter-tab active" data-filter="user" onclick="setAppFilter('user')">用戶</div>
                        <div class="filter-tab" data-filter="system" onclick="setAppFilter('system')">系統</div>
                        <div class="filter-tab" data-filter="all" onclick="setAppFilter('all')">全部</div>
                    </div>
                    <div class="view-toggle">
                        <div class="view-btn active" data-view="grid" onclick="setAppView('grid')" title="網格">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z" />
                            </svg>
                        </div>
                        <div class="view-btn" data-view="list" onclick="setAppView('list')" title="清單">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M4 14h4v-4H4v4zm0 5h4v-4H4v4zM4 9h4V5H4v4zm5 5h12v-4H9v4zm0 5h12v-4H9v4zM9 5v4h12V5H9z" />
                            </svg>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="installApk()">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg>
                        安裝 APK
                    </button>
                </div>
            </div>
            <div id="app-content" class="app-grid">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Notifications Page -->
        <div id="page-notifications" class="page-section">
            <div class="page-header">
                <h1>🔔 通知中心</h1>
                <div class="toolbar">
                    <button class="btn" onclick="refreshNotifications()">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                        </svg>
                        重新整理
                    </button>
                    <button class="btn" onclick="clearAllNotifications()">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                        </svg>
                        全部清除
                    </button>
                </div>
            </div>
            <div id="notification-content">
                <div class="empty-state">
                    <p>📱 通知監控已啟用</p>
                    <p style="margin-top: 8px; color: #555;">當 Android 裝置收到通知時，會顯示在這裡並同步到系統通知中心</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Go To Path Modal -->
    <div class="modal-overlay" id="gotoModal">
        <div class="modal">
            <h3>跳轉到路徑</h3>
            <input type="text" id="gotoPath" placeholder="/sdcard/..." onkeypress="if(event.key==='Enter')gotoPath()">
            <div class="modal-actions">
                <button class="btn" onclick="closeGotoModal()">取消</button>
                <button class="btn btn-primary" onclick="gotoPath()">前往</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const { ipcRenderer, clipboard } = require('electron');

        let currentPath = '/sdcard';
        let currentAppFilter = 'user';
        let currentAppView = 'grid';
        let allApps = [];

        // Page Navigation
        function switchPage(page) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });
            document.querySelectorAll('.page-section').forEach(section => {
                section.classList.toggle('active', section.id === `page-${page}`);
            });

            // 快速索引只在檔案管理時展開
            const quickPaths = document.getElementById('quickPaths');
            if (page === 'files') {
                quickPaths.classList.add('expanded');
            } else {
                quickPaths.classList.remove('expanded');
            }

            updateQuickPathActive();

            if (page === 'files') loadFiles(currentPath);
            if (page === 'apps') loadApps();
            if (page === 'notifications') loadNotifications();
        }

        function updateQuickPathActive() {
            document.querySelectorAll('.quick-path').forEach(item => {
                item.classList.toggle('active', item.dataset.path === currentPath);
            });
        }

        // Overview
        async function loadDeviceInfo() {
            const info = await ipcRenderer.invoke('get-device-info');
            if (!info) {
                document.getElementById('overview-content').innerHTML = `
                    <div class="empty-state">無法獲取裝置資訊</div>
                `;
                return;
            }

            document.getElementById('deviceName').textContent = `${info.manufacturer} ${info.model}`;
            document.getElementById('deviceSerial').textContent = info.serial;

            const batteryClass = info.isCharging ? 'charging' : (info.battery < 20 ? 'low' : '');

            document.getElementById('overview-content').innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="label">製造商 / 型號</div>
                        <div class="value">${info.manufacturer}</div>
                        <div class="sub-value">${info.model}</div>
                    </div>
                    <div class="info-card">
                        <div class="label">Android 版本</div>
                        <div class="value">Android ${info.androidVersion}</div>
                        <div class="sub-value">SDK ${info.sdkVersion}</div>
                    </div>
                    <div class="info-card">
                        <div class="label">網路</div>
                        <div class="value">${info.ssid || '未連接 Wi-Fi'}</div>
                        <div class="sub-value">${info.ipAddress || '--'}</div>
                    </div>
                    <div class="info-card">
                        <div class="label">電池</div>
                        <div class="value">
                            <div class="battery-bar">
                                <div class="battery-fill ${batteryClass}" style="width: ${info.battery || 0}%"></div>
                            </div>
                            ${info.battery || '--'}%${info.isCharging ? ' ⚡' : ''}
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="label">儲存空間</div>
                        <div class="value">${info.storageUsed || '--'} / ${info.storageTotal || '--'} GB</div>
                    </div>
                    <div class="info-card">
                        <div class="label">記憶體</div>
                        <div class="value">${info.memUsed || '--'} / ${info.memTotal || '--'} GB</div>
                    </div>
                </div>
                <div class="feature-card" onclick="startScreenMirror()">
                    <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
                    <span class="title">開始螢幕鏡像</span>
                </div>
            `;
        }

        // File Browser
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GB';
        }

        function updateBreadcrumb(path) {
            const parts = path.split('/').filter(p => p);
            let html = '<span onclick="navigateTo(\'/\')">/</span>';
            let accumulated = '';
            for (const part of parts) {
                accumulated += '/' + part;
                const p = accumulated;
                html += `<span class="sep">/</span><span onclick="navigateTo('${p}')">${part}</span>`;
            }
            document.getElementById('breadcrumb').innerHTML = html;
        }

        async function loadFiles(path) {
            currentPath = path;
            updateBreadcrumb(path);
            updateQuickPathActive();
            document.getElementById('file-content').innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            const files = await ipcRenderer.invoke('list-files', path);

            if (files.length === 0) {
                document.getElementById('file-content').innerHTML = '<div class="empty-state">資料夾為空</div>';
                return;
            }

            files.sort((a, b) => {
                if (a.isDirectory !== b.isDirectory) return b.isDirectory - a.isDirectory;
                return a.name.localeCompare(b.name);
            });

            document.getElementById('file-content').innerHTML = files.map(f => `
                <div class="file-item" ondblclick="${f.isDirectory ? `navigateTo('${f.path}')` : `downloadFile('${f.path}')`}">
                    <svg viewBox="0 0 24 24">
                        ${f.isDirectory
                    ? '<path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>'
                    : '<path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>'}
                    </svg>
                    <span class="name">${f.name}</span>
                    <span class="size">${f.isDirectory ? '' : formatSize(f.size)}</span>
                    <div class="actions">
                        ${!f.isDirectory ? `
                            <button onclick="event.stopPropagation(); downloadFile('${f.path}')" title="下載">
                                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                            </button>
                        ` : ''}
                        <button onclick="event.stopPropagation(); deleteFile('${f.path}')" title="刪除">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function navigateTo(path) {
            loadFiles(path);
        }

        async function downloadFile(path) {
            const result = await ipcRenderer.invoke('pull-file', path);
            if (result) showToast('檔案已儲存: ' + result.split('/').pop());
        }

        async function uploadFile() {
            const result = await ipcRenderer.invoke('push-file', currentPath);
            if (result) {
                showToast('檔案已上傳');
                loadFiles(currentPath);
            }
        }

        async function deleteFile(path) {
            if (!confirm('確定要刪除 ' + path.split('/').pop() + '?')) return;
            const result = await ipcRenderer.invoke('delete-file', path);
            if (result) {
                showToast('已刪除');
                loadFiles(currentPath);
            }
        }

        function copyPath() {
            clipboard.writeText(currentPath);
            showToast('已複製: ' + currentPath);
        }

        function showGotoModal() {
            document.getElementById('gotoPath').value = currentPath;
            document.getElementById('gotoModal').classList.add('active');
            document.getElementById('gotoPath').focus();
        }

        function closeGotoModal() {
            document.getElementById('gotoModal').classList.remove('active');
        }

        function gotoPath() {
            const path = document.getElementById('gotoPath').value.trim();
            if (path) {
                navigateTo(path);
                closeGotoModal();
            }
        }

        // App Manager
        function getGradientClass(pkg) {
            const hash = pkg.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
            return 'gradient-' + ((hash % 6) + 1);
        }

        async function loadApps() {
            document.getElementById('app-content').innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            allApps = await ipcRenderer.invoke('list-apps', currentAppFilter);
            renderApps();
        }

        function renderApps() {
            const searchTerm = document.getElementById('appSearch').value.toLowerCase();
            const filtered = allApps.filter(app =>
                app.name.toLowerCase().includes(searchTerm) ||
                app.package.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                document.getElementById('app-content').innerHTML = '<div class="empty-state">沒有找到應用</div>';
                return;
            }

            const container = document.getElementById('app-content');
            container.className = currentAppView === 'list' ? 'app-grid list-view' : 'app-grid';

            container.innerHTML = filtered.map(app => `
                <div class="app-item">
                    <div class="app-header">
                        <div class="icon ${getGradientClass(app.package)}">
                            <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                        </div>
                        <div class="info">
                            <div class="name">${app.name}</div>
                            <div class="package" title="${app.package}">${app.package}</div>
                        </div>
                    </div>
                    <div class="app-actions">
                        <button onclick="launchApp('${app.package}')" title="啟動">▶ 啟動</button>
                        <button onclick="exportApk('${app.package}')" title="導出">📦 導出</button>
                        <button class="danger" onclick="uninstallApp('${app.package}')" title="移除">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function setAppFilter(filter) {
            currentAppFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });
            loadApps();
        }

        function setAppView(view) {
            currentAppView = view;
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            renderApps();
        }

        function filterApps() {
            renderApps();
        }

        async function launchApp(packageName) {
            const result = await ipcRenderer.invoke('launch-app', packageName);
            if (result) showToast('應用已啟動');
        }

        async function exportApk(packageName) {
            showToast('正在導出 APK...');
            const result = await ipcRenderer.invoke('export-apk', packageName);
            if (result) showToast('APK 已導出');
            else showToast('導出失敗');
        }

        async function uninstallApp(packageName) {
            if (!confirm('確定要移除 ' + packageName + '?')) return;
            const result = await ipcRenderer.invoke('uninstall-app', packageName);
            if (result) {
                showToast('應用已移除');
                loadApps();
            }
        }

        async function installApk() {
            const result = await ipcRenderer.invoke('install-apk');
            if (result) {
                showToast('APK 安裝成功');
                loadApps();
            }
        }

        // Notifications
        let notifications = [];

        async function loadNotifications() {
            const notifs = await ipcRenderer.invoke('get-notifications');
            if (notifs && notifs.length > 0) {
                notifications = notifs;
                renderNotifications();
            }
        }

        function renderNotifications() {
            if (notifications.length === 0) {
                document.getElementById('notification-content').innerHTML = `
                    <div class="empty-state">
                        <p>📱 暫無通知</p>
                    </div>
                `;
                return;
            }

            document.getElementById('notification-content').innerHTML = notifications.map((n, i) => `
                <div class="info-card" style="margin-bottom: 8px; cursor: pointer;" onclick="openNotification(${i})">
                    <div class="label">${n.app || '未知應用'}</div>
                    <div class="value">${n.title || '通知'}</div>
                    <div class="sub-value">${n.text || ''}</div>
                </div>
            `).join('');
        }

        async function refreshNotifications() {
            showToast('重新整理通知...');
            await loadNotifications();
        }

        async function clearAllNotifications() {
            await ipcRenderer.invoke('clear-notifications');
            notifications = [];
            renderNotifications();
            showToast('已清除所有通知');
        }

        function openNotification(index) {
            const n = notifications[index];
            if (n && n.package) {
                launchApp(n.package);
            }
        }

        // Listen for new notifications from main process
        ipcRenderer.on('new-notification', (event, notif) => {
            notifications.unshift(notif);
            if (document.querySelector('[data-page="notifications"].active')) {
                renderNotifications();
            }
        });

        function startScreenMirror() {
            ipcRenderer.send('start-screen-mirror');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2500);
        }

        // Initial load
        loadDeviceInfo();
    </script>
</body>

</html>
