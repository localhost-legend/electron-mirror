<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Electron Mirror - Select Device</title>
    <link rel="stylesheet" href="launcher.css">
</head>

<body>
    <header>
        <h1>Electron Mirror</h1>
        <div class="subtitle">High-Performance Android Mirror</div>
    </header>

    <main>
        <div class="section-title">可用裝置</div>
        <div class="device-list" id="deviceList">
            <div class="empty-state">
                <div class="spinner" style="margin: auto;"></div>
                <p style="margin-top: 16px;">正在搜尋裝置...</p>
            </div>
        </div>
    </main>

    <footer>
        <button class="btn-refresh" onclick="loadDevices()">
            <svg viewBox="0 0 24 24">
                <path
                    d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
            </svg>
            重新整理
        </button>
        <div class="footer-actions">
            <button class="btn-menu" id="launcher-menu-button" aria-label="Menu">⋯</button>
            <div class="version">v1.0.0</div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <div id="device-context-menu" class="context-menu">
        <button class="context-item" data-action="rename">重新命名</button>
        <button class="context-item" data-action="settings">開啟設定</button>
        <button class="context-item" data-action="hide">從清單隱藏</button>
        <button class="context-item" data-action="disconnect">完全斷線</button>
    </div>

    <div id="launcher-menu" class="launcher-menu">
        <div class="menu-section menu-debug">
            <div class="menu-title">除錯</div>
            <label class="menu-toggle">
                <input type="checkbox" id="toggle-stats">
                <span>輸出 SCRCPY Stats</span>
            </label>
        </div>
        <div class="menu-section menu-device">
            <div class="menu-title">裝置</div>
            <button class="menu-item" data-action="add-device">新增裝置</button>
            <div class="menu-inline hidden" id="add-device-form">
                <div class="menu-inline-title">新增裝置</div>
                <input type="text" id="add-device-input" placeholder="ip:port 或 ip (預設 5555)">
                <div class="menu-inline-actions">
                    <button class="menu-item action" data-action="confirm-add">連線</button>
                    <button class="menu-item action" data-action="cancel-add">返回</button>
                </div>
            </div>
            <button class="menu-item" data-action="toggle-hidden">復原隱藏的裝置</button>
            <div class="menu-sublist hidden" id="hidden-device-list"></div>
            <button class="menu-item action hidden" data-action="back-hidden" id="hidden-back">返回</button>
        </div>
    </div>

    <script src="launcher.js"></script>
</body>

</html>
