<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="screenMirror.css">
</head>

<body>
    <div id="app">
        <button id="sidebar-edge-trigger" title="展開側邊欄" aria-label="展開側邊欄">
            <svg viewBox="0 0 24 24">
                <path d="M10 6l6 6-6 6z" />
            </svg>
        </button>

        <!-- Video Container -->
        <div id="video-container">
            <canvas id="videoCanvas"></canvas>

            <!-- Loading Overlay (Moved inside to cover video area) -->
            <div id="loading-overlay">
                <div class="loader"></div>
                <div class="tip">正在連接裝置...<br>請在手機上允許 USB 偵錯授權</div>
                <div id="status"></div>
            </div>

            <!-- IME Input -->
            <div id="ime-container">
                <input type="text" id="ime-input" placeholder="輸入文字...">
                <button id="btn-send">發送</button>
            </div>
        </div>

        <div id="sidebar">
            <button class="btn" id="btn-sidebar-toggle" title="收合側邊欄">
                <svg viewBox="0 0 24 24">
                    <path d="M14 6l-6 6 6 6z" />
                </svg>
            </button>

            <button class="btn" id="btn-return-overview" title="檢視資訊">
                <svg viewBox="0 0 24 24">
                    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
                </svg>
            </button>

            <button class="btn" id="btn-device-settings" title="裝置設定">
                <svg viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.06 7.06 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.23-1.12.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.81 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.51.41 1.05.71 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.58-.23 1.12-.53 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z" />
                </svg>
            </button>
            <!-- Navigation -->
            <button class="btn" id="btn-back" title="返回">
                <svg viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
            </button>

            <button class="btn" id="btn-home" title="主畫面">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                </svg>
            </button>

            <button class="btn" id="btn-recent" title="最近應用">
                <svg viewBox="0 0 24 24">
                    <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z" />
                </svg>
            </button>

            <!-- Keyboard -->
            <button class="btn" id="btn-keyboard" title="鍵盤">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z" />
                </svg>
            </button>

            <!-- Key Mapper -->
            <button class="btn" id="btn-mapper" title="按鍵映射">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                </svg>
            </button>

            <!-- Volume -->
            <button class="btn" id="btn-vol-up" title="音量+">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
            </button>

            <button class="btn" id="btn-vol-down" title="音量-">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z" />
                </svg>
            </button>

            <button class="btn" id="btn-sidebar-more" title="更多功能">
                <svg viewBox="0 0 24 24">
                    <path d="M12 8a2 2 0 1 0 0.001 0zM12 14a2 2 0 1 0 0.001 0zM12 20a2 2 0 1 0 0.001 0z" />
                </svg>
            </button>
        </div>
        <div id="sidebar-more-menu">
            <button class="sidebar-more-item" data-target="btn-return-overview">檢視資訊</button>
            <button class="sidebar-more-item" data-target="btn-device-settings">裝置設定</button>
            <button class="sidebar-more-item" data-target="btn-back">返回</button>
            <button class="sidebar-more-item" data-target="btn-home">主畫面</button>
            <button class="sidebar-more-item" data-target="btn-recent">最近應用</button>
            <button class="sidebar-more-item" data-target="btn-keyboard">鍵盤</button>
            <button class="sidebar-more-item" data-target="btn-mapper">按鍵映射</button>
            <button class="sidebar-more-item" data-target="btn-vol-up">音量+</button>
            <button class="sidebar-more-item" data-target="btn-vol-down">音量-</button>
        </div>

        <script src="screenMirror.js"></script>
    </div>
</body>

</html>
